# Los espacios de trabajo del monorepo, en el formato que pnpm entiende (M8).
#
# **Por que existe este fichero**: `package.json` declara `workspaces` al estilo
# de npm, **y pnpm no lo lee**. Sin esto, los paquetes internos —`@opofuente/contracts`—
# **no se enlazan**, y `pnpm dev` los pide al registro de npm, donde no existen.
#
# **Se anade y NO se quita `workspaces` de `package.json`**: pnpm lo ignora, y
# quitarlo romperia a quien instale con npm. Los dos conviven.
packages:
  - 'apps/*'
  - 'packages/*'

# **Los overrides van aqui y no en `package.json`**: pnpm 11 ya no lee el campo
# `pnpm` de alli, y avisa de que lo ignora. Con dos versiones de Playwright en
# el arbol, cada hook de prueba falla en una distinta —«did not expect
# test.afterAll() to be called here»— y el mensaje no dice que el problema sea
# ese.
overrides:
  '@playwright/test': 1.63.0
  playwright: 1.63.0
  playwright-core: 1.63.0
