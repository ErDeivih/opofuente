# Configuración de Alembic para OpoFuente.
# La URL real la resuelve apps/api/alembic/env.py a partir de OpoFuente Settings
# (OPOFUENTE_DATA_DIR). Aquí no se escribe ninguna credencial ni ruta absoluta.

[alembic]
script_location = apps/api/alembic
prepend_sys_path = apps/api
path_separator = os
# Dejar vacío: env.py usa la configuración de la aplicación.
sqlalchemy.url =
# SQLite no soporta ALTER completo; las migraciones usan modo batch.
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
