[project]
name = "opofuente"
version = "0.0.0"
description = "Biblioteca personal local para organizar y estudiar material de TAI y Guardia Civil"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    # PyMuPDF solo lo usan las herramientas que construyen fixtures desde el PDF oficial del
    # temario (apps/api/opofuente/tools/build_profile_fixtures.py). Pasará al grupo de
    # producción en S03, cuando la aplicación extraiga PDF. Licencia AGPL-3.0 (ver ADR-005).
    "pymupdf>=1.24",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# El código de producción vive en apps/api/opofuente (02_ARCHITECTURE §2).
packages = ["apps/api/opofuente"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
# La raíz de temporales del sistema en este equipo contiene un resto propiedad de SYSTEM
# (creado por un proceso elevado) que impide a pytest limpiar su propio directorio raíz.
# Se usa una raíz dentro del repositorio, ignorada por git, para que la suite sea hermética
# y no dependa de permisos ajenos. No ejecutar dos sesiones de pytest en paralelo.
addopts = "-ra --strict-markers --strict-config --basetemp=.pytest-tmp"
markers = [
    "external: pruebas que requieren credenciales o red externa (no se ejecutan por defecto)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api"]
extend-exclude = [".venv", "data", "node_modules", ".e2e-data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
    "RUF", # ruff
]

[tool.ruff.lint.per-file-ignores]
# `assert` es la forma esperada de comprobar en pytest.
"apps/api/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["opofuente"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/opofuente", "apps/api/alembic/env.py"]
mypy_path = "apps/api"
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = false
