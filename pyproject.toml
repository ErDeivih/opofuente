[project]
name = "opofuente"
version = "0.0.0"
description = "Biblioteca personal local para organizar y estudiar material de TAI y Guardia Civil"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "lxml>=5.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # PyMuPDF se usa en producción desde S03 (extractor de PDF) y en las herramientas que
    # construyen fixtures desde el PDF oficial. Licencia AGPL-3.0: uso local y privado cubierto
    # por DEBT-003; distribuir la aplicación obligaría a revisar la licencia.
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "lxml-stubs>=0.5.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# El código de producción vive en apps/api/opofuente (02_ARCHITECTURE §2).
packages = ["apps/api/opofuente"]

[tool.pytest.ini_options]
minversion = "8.0"
# Solo `apps/api` está en el path. Los constructores de documentos sintéticos y los dobles de prueba
# viven en `opofuente_testing` (paquete normal, tipado y comprobado con mypy), no en una carpeta de
# pruebas metida en `pythonpath`: incluir `apps/api/tests` tapaba importaciones mal escritas.
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
# La raíz de temporales del sistema en este equipo contiene un resto propiedad de SYSTEM
# (creado por un proceso elevado) que impide a pytest limpiar su propio directorio raíz.
# Se usa una raíz dentro del repositorio, ignorada por git, para que la suite sea hermética
# y no dependa de permisos ajenos. No ejecutar dos sesiones de pytest en paralelo.
addopts = "-ra --strict-markers --strict-config --basetemp=.pytest-tmp"
markers = [
    "external: pruebas que requieren credenciales o red externa (no se ejecutan por defecto)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api"]
extend-exclude = [".venv", "data", "node_modules", ".e2e-data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit
    "RUF", # ruff
]

[tool.ruff.lint.per-file-ignores]
# `assert` es la forma esperada de comprobar en pytest.
"apps/api/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["opofuente"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/opofuente", "apps/api/alembic/env.py", "apps/api/opofuente_testing"]
mypy_path = ["apps/api", "apps/api/typestubs"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = false

# lxml no publica stubs en el paquete; el proyecto declara los suyos como dependencia de desarrollo
# (`lxml-stubs`) para no apagar la comprobación de tipos de todo el módulo.
[[tool.mypy.overrides]]
module = ["lxml.*"]
follow_untyped_imports = true
