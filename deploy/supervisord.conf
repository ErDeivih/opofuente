[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# La API sigue en loopback: la guardia de OPOFUENTE_HOST se respeta.
[program:api]
command=/app/.venv/bin/python -m uvicorn opofuente.main:app --host 127.0.0.1 --port 8765 --log-level info
directory=/app/apps/api
environment=PYTHONPATH="/app/apps/api"
autostart=true
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Fachada pública: nginx escucha en $PORT (la variable la expande el propio nginx? No: el
# entrypoint genera el fichero de configuración con el puerto ya sustituido).
[program:web]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
